[build]
builder = "RAILPACK"
buildCommand = "npm run build -w @hospitalityos/shared && npm run build -w @datazone/db && npm run build:self -w @datazone/service"

[deploy]
startCommand = "npm run start -w @datazone/service"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
