[build]
builder = "RAILPACK"
buildCommand = "npm run build -w @hospitalityos/shared && npm run build:self -w sovereign-drive-engine"

[deploy]
startCommand = "npm run start -w sovereign-drive-engine"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
